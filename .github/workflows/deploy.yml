name: Deploy Orbiee

on:
  repository_dispatch:
    types: [trigger-orbiee]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.env.outputs.branch }}
      region: ${{ steps.env.outputs.region }}
      artifact_registry_region: ${{ steps.env.outputs.artifact_registry_region }}
      artifact_registry_repo: ${{ steps.env.outputs.artifact_registry_repo }}
      cloud_run_service: ${{ steps.env.outputs.cloud_run_service }}
      cloud_worker_service: ${{ steps.env.outputs.cloud_worker_service }}
      emotion_detection_service: ${{ steps.env.outputs.emotion_detection_service }}
      image_name: ${{ steps.env.outputs.image_name }}
      emotion_detection_image_name: ${{ steps.env.outputs.emotion_detection_image_name }}
      impressions_image_name: ${{ steps.env.outputs.impressions_image_name }}
      preferences_image_name: ${{ steps.env.outputs.preferences_image_name }}
      type_affinity_image_name: ${{ steps.env.outputs.type_affinity_image_name }}
      item_popularity_image_name: ${{ steps.env.outputs.item_popularity_image_name }}
      environment: ${{ steps.env.outputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATETOKENPULL }}

      - name: Determine Environment
        id: env
        run: |
          BRANCH="${{ github.event.client_payload.ref }}"
          REPO="${{ github.event.client_payload.repository }}"

          if [[ "$REPO" == "orbiee-jktech/Orbiee_Backend_Azure" ]]; then

            case "$BRANCH" in
              rearchitecture|feature/emotion_detection)
                CLOUD_RUN_SERVICE="orbiee-backend-dev"
                IMAGE_NAME="orbiee-backend-dev"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics-dev"
                PREFERENCES_IMAGE_NAME="orbiee-preferences-dev"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh-dev"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh-dev"
                CLOUD_WORKER_SERVICE="orbiee-worker-dev"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection-dev"
                ENVIRONMENT="dev"
                ;;

              feature/SearchRetrieval)
                CLOUD_RUN_SERVICE="orbiee-backend-dev1"
                IMAGE_NAME="orbiee-backend-dev1"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics-dev1"
                PREFERENCES_IMAGE_NAME="orbiee-preferences-dev1"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh-dev1"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh-dev1"
                CLOUD_WORKER_SERVICE="orbiee-worker-dev1"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection-dev"
                ENVIRONMENT="dev"
                ;;

              feature/*)
                CLOUD_RUN_SERVICE="orbiee-backend-dev"
                IMAGE_NAME="orbiee-backend-dev"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection-dev"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics-dev"
                PREFERENCES_IMAGE_NAME="orbiee-preferences-dev"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh-dev"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh-dev"
                CLOUD_WORKER_SERVICE="orbiee-worker-dev"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection-dev"
                ENVIRONMENT="dev"
                ;;

              rearchitecture_demo)
                CLOUD_RUN_SERVICE="orbiee-backend"
                IMAGE_NAME="orbiee-backend"
                EMOTION_DETECTION_IMAGE_NAME="orbiee-emotion-detection"
                IMPRESSIONS_IMAGE_NAME="orbiee-impressions-analytics"
                PREFERENCES_IMAGE_NAME="orbiee-preferences"
                TYPE_AFFINITY_IMAGE_NAME="orbiee-type-affinity-refresh"
                ITEM_POPULARITY_IMAGE_NAME="orbiee-item-popularity-refresh"
                CLOUD_WORKER_SERVICE="orbiee-worker"
                EMOTION_DETECTION_SERVICE="orbiee-emotion-detection"
                ENVIRONMENT="demo"
                ;;

              *)
                echo "Unsupported backend branch: $BRANCH"
                exit 1
                ;;
            esac

          else

            case "$BRANCH" in
              dev|rearchitecture)
                CLOUD_RUN_SERVICE="orbiee-dev"
                IMAGE_NAME="orbiee-dev"
                ;;

              search-testing)
                CLOUD_RUN_SERVICE="orbiee-dev1"
                IMAGE_NAME="orbiee-dev1"
                ;;

              demov1|rearchitecture_demo)
                CLOUD_RUN_SERVICE="orbiee"
                IMAGE_NAME="orbiee-demo"
                ;;

              *)
                echo "Unsupported frontend branch: $BRANCH"
                exit 1
                ;;
            esac

          fi

          # Azure configuration
          REGION="centralus"
          ARTIFACT_REGISTRY_REGION="centralus"
          ARTIFACT_REGISTRY_REPO="orbiee"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "artifact_registry_region=$ARTIFACT_REGISTRY_REGION" >> $GITHUB_OUTPUT
          echo "artifact_registry_repo=$ARTIFACT_REGISTRY_REPO" >> $GITHUB_OUTPUT
          echo "cloud_run_service=$CLOUD_RUN_SERVICE" >> $GITHUB_OUTPUT
          echo "cloud_worker_service=$CLOUD_WORKER_SERVICE" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "emotion_detection_service=$EMOTION_DETECTION_SERVICE" >> $GITHUB_OUTPUT
          echo "emotion_detection_image_name=$EMOTION_DETECTION_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "impressions_image_name=$IMPRESSIONS_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "preferences_image_name=$PREFERENCES_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "type_affinity_image_name=$TYPE_AFFINITY_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "item_popularity_image_name=$ITEM_POPULARITY_IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

  deploy-backend:
    if: ${{ github.event.client_payload.repository == 'orbiee-jktech/Orbiee_Backend_Azure' }}
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATETOKENPULL }}
          fetch-depth: 0

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Check for Changes
        id: check
        run: |
          git fetch --tags 2>/dev/null || true
          BRANCH="${{ needs.setup.outputs.branch }}"
          CHANGED=""

          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            ORIGIN_SHA=$(git rev-parse "origin/$BRANCH")
            HEAD_SHA=$(git rev-parse HEAD)

            if [[ "$ORIGIN_SHA" == "$HEAD_SHA" ]]; then
              CHANGED="true"
            else
              CHANGED=$(git diff --name-only "origin/$BRANCH" HEAD | \
                grep -vE '^(\.github/|README|WEBRTC_|cloudbuild)' || true)
            fi
          else
            CHANGED="true"
          fi

          if [[ -n "$CHANGED" ]]; then
            echo "Changes detected, will deploy"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant changes, skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Image Tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TAG=$(date +%Y%m%d-%H%M%S)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: steps.check.outputs.has_changes == 'true'
        run: |
          ACR_NAME="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          echo "ACR: $ACR_LOGIN_SERVER"

          docker build \
            -f apps/orbiee_core/Dockerfile \
            -t ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/impressions_analytics_job/Dockerfile \
            -t ${ACR_LOGIN_SERVER}/${IMPRESSIONS_IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/affinity_learning_service/Dockerfile \
            -t ${ACR_LOGIN_SERVER}/${PREFERENCES_IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/type_affinity_refresh_job/Dockerfile \
            -t ${ACR_LOGIN_SERVER}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG} \
            .

          docker build \
            -f apps/item_popularity_refresh_job/Dockerfile \
            -t ${ACR_LOGIN_SERVER}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG} \
            .

          az acr login --name "$ACR_NAME"

          docker push ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}
          docker push ${ACR_LOGIN_SERVER}/${IMPRESSIONS_IMAGE_NAME}:${TAG}
          docker push ${ACR_LOGIN_SERVER}/${PREFERENCES_IMAGE_NAME}:${TAG}
          docker push ${ACR_LOGIN_SERVER}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG}
          docker push ${ACR_LOGIN_SERVER}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG}

          if [ "${{ github.event.client_payload.deploy_emotion_detection }}" = "yes" ]; then
            docker build \
              -f apps/emotion_detection_service/Dockerfile \
              -t ${ACR_LOGIN_SERVER}/${EMOTION_DETECTION_IMAGE_NAME}:${TAG} \
              apps/emotion_detection_service
          
            docker push ${ACR_LOGIN_SERVER}/${EMOTION_DETECTION_IMAGE_NAME}:${TAG}
          fi

      - name: Deploy to Azure Container Apps
        if: steps.check.outputs.has_changes == 'true'
        run: |
          CLOUD_RUN_SERVICE="${{ needs.setup.outputs.cloud_run_service }}"
          CLOUD_WORKER_SERVICE="${{ needs.setup.outputs.cloud_worker_service }}"
          EMOTION_DETECTION_SERVICE="${{ needs.setup.outputs.emotion_detection_service }}"
          REGION="${{ needs.setup.outputs.region }}"
          ACR_NAME="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"
          ENVIRONMENT="${{ needs.setup.outputs.environment }}"

          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          CONTAINER_APP_ENVIRONMENT="${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}"

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          AZCR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          AZCR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query passwords[0].value --output tsv)

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}"

          echo "Deploying for env: $ENVIRONMENT"
          echo "Container App: $CLOUD_RUN_SERVICE"
          echo "Image: $IMAGE"

          if [ "$ENVIRONMENT" = "dev" ]; then
            DB_CONFIG="${{ secrets.AZURE_DB_CONFIG }}"
            API_KEYS_JSON="${{ secrets.AZURE_API_KEYS_JSON }}"
            REDIS_URL="${{ secrets.AZURE_REDIS_URL }}"
            ORBIEE_SEARCH_BACKEND="${{ secrets.AZURE_ORBIEE_SEARCH_BACKEND }}"
          else
            DB_CONFIG="${{ secrets.AZURE_DB_CONFIG_DEMO }}"
            API_KEYS_JSON="${{ secrets.AZURE_API_KEYS_JSON }}"
            REDIS_URL="${{ secrets.AZURE_DEMO_REDIS_URL }}"
            ORBIEE_SEARCH_BACKEND="${{ secrets.AZURE_ORBIEE_SEARCH_BACKEND_DEMO }}"
          fi

          # ------------------------------------------------------------
          # Main Cloud Run / API Service
          # ------------------------------------------------------------
          if az containerapp show --name "$CLOUD_RUN_SERVICE" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating existing Container App ($CLOUD_RUN_SERVICE)..."
            
            az containerapp secret set \
              --name "$CLOUD_RUN_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --secrets \
                DB_CONFIG="$DB_CONFIG" \
                API_KEYS_JSON="$API_KEYS_JSON" \
                REDIS_URL="$REDIS_URL" \
                ORBIEE_SEARCH_BACKEND="$ORBIEE_SEARCH_BACKEND"

            az containerapp update \
              --name "$CLOUD_RUN_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --cpu 1 \
              --memory 2Gi \
              --set-env-vars \
                ORBIEE_GCP_PROJECT=retail-jkommerce-poc \
                ORBIEE_DEBUG=false \
                VERTEX_PROJECT=218142584790 \
                RETAIL_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/servingConfigs/recommenedfy \
                RETAIL_BRANCH=projects/218142584790/locations/global/catalogs/default_catalog/branches/2 \
                RETAIL_SEARCH_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/placements/default_search \
                ORBIEE_EMOTION_SERVICE_URL=https://${EMOTION_DETECTION_SERVICE}.${REGION}.azurecontainerapps.io \
                DB_CONFIG=secretref:DB_CONFIG \
                API_KEYS_JSON=secretref:API_KEYS_JSON \
                REDIS_URL=secretref:REDIS_URL \
                ORBIEE_SEARCH_BACKEND=secretref:ORBIEE_SEARCH_BACKEND
          else
            echo "Creating new Container App ($CLOUD_RUN_SERVICE)..."
            
            az containerapp create \
              --name "$CLOUD_RUN_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --image "$IMAGE" \
              --cpu 1 \
              --memory 2Gi \
              --ingress external \
              --target-port 80 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD" \
              --secrets \
                DB_CONFIG="$DB_CONFIG" \
                API_KEYS_JSON="$API_KEYS_JSON" \
                REDIS_URL="$REDIS_URL" \
                ORBIEE_SEARCH_BACKEND="$ORBIEE_SEARCH_BACKEND" \
              --set-env-vars \
                ORBIEE_GCP_PROJECT=retail-jkommerce-poc \
                ORBIEE_DEBUG=false \
                VERTEX_PROJECT=218142584790 \
                RETAIL_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/servingConfigs/recommenedfy \
                RETAIL_BRANCH=projects/218142584790/locations/global/catalogs/default_catalog/branches/2 \
                RETAIL_SEARCH_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/placements/default_search \
                ORBIEE_EMOTION_SERVICE_URL=https://${EMOTION_DETECTION_SERVICE}.${REGION}.azurecontainerapps.io \
                DB_CONFIG=secretref:DB_CONFIG \
                API_KEYS_JSON=secretref:API_KEYS_JSON \
                REDIS_URL=secretref:REDIS_URL \
                ORBIEE_SEARCH_BACKEND=secretref:ORBIEE_SEARCH_BACKEND
          fi

          echo ""
          echo "Deployed: $CLOUD_RUN_SERVICE"

          URL=$(az containerapp show \
            --name "$CLOUD_RUN_SERVICE" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "URL: https://${URL}"

          # ------------------------------------------------------------
          # Worker
          # ------------------------------------------------------------
          if az containerapp show --name "$CLOUD_WORKER_SERVICE" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating existing Worker ($CLOUD_WORKER_SERVICE)..."
            az containerapp update \
              --name "$CLOUD_WORKER_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --cpu 1 \
              --memory 2Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --set-env-vars \
                ORBIEE_GCP_PROJECT=retail-jkommerce-poc \
                ORBIEE_DEBUG=false \
                VERTEX_PROJECT=218142584790 \
                RETAIL_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/servingConfigs/recommenedfy \
                RETAIL_BRANCH=projects/218142584790/locations/global/catalogs/default_catalog/branches/2 \
                RETAIL_SEARCH_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/placements/default_search \
                DB_CONFIG=secretref:DB_CONFIG \
                API_KEYS_JSON=secretref:API_KEYS_JSON \
                REDIS_URL=secretref:REDIS_URL \
                ORBIEE_SEARCH_BACKEND=secretref:ORBIEE_SEARCH_BACKEND \
              --command python \
              --args "-m" "orbiee.workers.session_worker"
          else
            echo "Creating new Worker ($CLOUD_WORKER_SERVICE)..."
            az containerapp create \
              --name "$CLOUD_WORKER_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --image "$IMAGE" \
              --cpu 1 \
              --memory 2Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD" \
              --set-env-vars \
                ORBIEE_GCP_PROJECT=retail-jkommerce-poc \
                ORBIEE_DEBUG=false \
                VERTEX_PROJECT=218142584790 \
                RETAIL_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/servingConfigs/recommenedfy \
                RETAIL_BRANCH=projects/218142584790/locations/global/catalogs/default_catalog/branches/2 \
                RETAIL_SEARCH_PLACEMENT=projects/218142584790/locations/global/catalogs/default_catalog/placements/default_search \
                DB_CONFIG=secretref:DB_CONFIG \
                API_KEYS_JSON=secretref:API_KEYS_JSON \
                REDIS_URL=secretref:REDIS_URL \
                ORBIEE_SEARCH_BACKEND=secretref:ORBIEE_SEARCH_BACKEND \
              --command python \
              --args "-m" "orbiee.workers.session_worker"
          fi

          # ------------------------------------------------------------
          # Emotion Detection
          # ------------------------------------------------------------
          if [ "${{ github.event.client_payload.deploy_emotion_detection }}" = "yes" ]; then
            EMOTION_IMAGE="${ACR_LOGIN_SERVER}/${EMOTION_DETECTION_IMAGE_NAME}:${TAG}"
            
            if az containerapp show --name "$EMOTION_DETECTION_SERVICE" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
              echo "Updating existing Emotion Detection..."
              az containerapp update \
                --name "$EMOTION_DETECTION_SERVICE" \
                --resource-group "$RESOURCE_GROUP" \
                --image "$EMOTION_IMAGE" \
                --cpu 4 \
                --memory 8Gi \
                --min-replicas 1 \
                --max-replicas 1 \
                --set-env-vars \
                  EMOTION_MODEL_HUB=hf
            else
              echo "Creating new Emotion Detection..."
              az containerapp create \
                --name "$EMOTION_DETECTION_SERVICE" \
                --resource-group "$RESOURCE_GROUP" \
                --environment "$CONTAINER_APP_ENVIRONMENT" \
                --image "$EMOTION_IMAGE" \
                --cpu 4 \
                --memory 8Gi \
                --min-replicas 1 \
                --max-replicas 1 \
                --target-port 80 \
                --ingress external \
                --registry-server "$ACR_LOGIN_SERVER" \
                --registry-username "$AZCR_USERNAME" \
                --registry-password "$AZCR_PASSWORD" \
                --set-env-vars \
                  EMOTION_MODEL_HUB=hf
            fi
          fi

          # ------------------------------------------------------------
          # Impressions Analytics Job
          # ------------------------------------------------------------
          if az containerapp job show \
            --name "${IMPRESSIONS_IMAGE_NAME}" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            
            echo "Updating existing job..."
            az containerapp job update \
              --name "${IMPRESSIONS_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_LOGIN_SERVER}/${IMPRESSIONS_IMAGE_NAME}:${TAG}"
          else
            echo "Creating new job..."
            az containerapp job create \
              --name "${IMPRESSIONS_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 900 \
              --replica-retry-limit 1 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD" \
              --image "${ACR_LOGIN_SERVER}/${IMPRESSIONS_IMAGE_NAME}:${TAG}"
          fi

          # ------------------------------------------------------------
          # Preferences Job
          # ------------------------------------------------------------
          if az containerapp job show \
            --name "${PREFERENCES_IMAGE_NAME}" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            
            echo "Updating existing preferences job..."
            az containerapp job update \
              --name "${PREFERENCES_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_LOGIN_SERVER}/${PREFERENCES_IMAGE_NAME}:${TAG}"
          else
            echo "Creating new preferences job..."
            az containerapp job create \
              --name "${PREFERENCES_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 900 \
              --replica-retry-limit 1 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD" \
              --image "${ACR_LOGIN_SERVER}/${PREFERENCES_IMAGE_NAME}:${TAG}"
          fi

          # ------------------------------------------------------------
          # Type Affinity Refresh Job
          # ------------------------------------------------------------
          if az containerapp job show \
            --name "${TYPE_AFFINITY_IMAGE_NAME}" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            
            echo "Updating existing type affinity job..."
            az containerapp job update \
              --name "${TYPE_AFFINITY_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_LOGIN_SERVER}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG}"
          else
            echo "Creating new type affinity job..."
            az containerapp job create \
              --name "${TYPE_AFFINITY_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 900 \
              --replica-retry-limit 1 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD" \
              --image "${ACR_LOGIN_SERVER}/${TYPE_AFFINITY_IMAGE_NAME}:${TAG}"
          fi

          # ------------------------------------------------------------
          # Item Popularity Refresh Job
          # ------------------------------------------------------------
          if az containerapp job show \
            --name "${ITEM_POPULARITY_IMAGE_NAME}" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            
            echo "Updating existing item popularity job..."
            az containerapp job update \
              --name "${ITEM_POPULARITY_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${ACR_LOGIN_SERVER}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG}"
          else
            echo "Creating new item popularity job..."
            az containerapp job create \
              --name "${ITEM_POPULARITY_IMAGE_NAME}" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --trigger-type Manual \
              --replica-timeout 900 \
              --replica-retry-limit 1 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD" \
              --image "${ACR_LOGIN_SERVER}/${ITEM_POPULARITY_IMAGE_NAME}:${TAG}"
          fi

  deploy-frontend:
    if: ${{ github.event.client_payload.repository == 'orbiee-jktech/Orbiee_Frontend_Azure' }}
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATETOKENPULL }}
          fetch-depth: 0

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure Subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Check for Changes
        id: check
        run: |
          git fetch --tags 2>/dev/null || true
          BRANCH="${{ needs.setup.outputs.branch }}"
          CHANGED=""

          if git rev-parse --verify "origin/$BRANCH" >/dev/null 2>&1; then
            ORIGIN_SHA=$(git rev-parse "origin/$BRANCH")
            HEAD_SHA=$(git rev-parse HEAD)

            if [[ "$ORIGIN_SHA" == "$HEAD_SHA" ]]; then
              CHANGED="true"
            else
              CHANGED=$(git diff --name-only "origin/$BRANCH" HEAD | \
                grep -vE '^(\.github/|README|WEBRTC_|cloudbuild)' || true)
            fi
          else
            CHANGED="true"
          fi

          if [[ -n "$CHANGED" ]]; then
            echo "Changes detected, will deploy"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant changes, skipping"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Image Tag
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TAG=$(date +%Y%m%d-%H%M%S)
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        if: steps.check.outputs.has_changes == 'true'
        run: |
          ACR_NAME="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"

          REACT_APP_ENV="dev"

          # case "$BRANCH" in
          #   dev|rearchitecture) REACT_APP_ENV="dev" ;;
          #   demov1|rearchitecture_demo) REACT_APP_ENV="demov1" ;;
          # esac

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          docker build \
            --build-arg REACT_APP_ENV=${REACT_APP_ENV} \
            -t ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG} \
            .

          az acr login --name "$ACR_NAME"

          docker push ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}

      - name: Deploy to Azure Container Apps
        if: steps.check.outputs.has_changes == 'true'
        run: |
          CLOUD_RUN_SERVICE="${{ needs.setup.outputs.cloud_run_service }}"
          REGION="${{ needs.setup.outputs.region }}"
          ACR_NAME="${{ needs.setup.outputs.artifact_registry_repo }}"
          IMAGE_NAME="${{ needs.setup.outputs.image_name }}"

          RESOURCE_GROUP="${{ secrets.AZURE_RESOURCE_GROUP }}"
          CONTAINER_APP_ENVIRONMENT="${{ secrets.AZURE_CONTAINER_APP_ENVIRONMENT }}"

          ACR_LOGIN_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            --output tsv)

          AZCR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          AZCR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query passwords[0].value --output tsv)

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}"

          if az containerapp show --name "$CLOUD_RUN_SERVICE" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating existing Container App ($CLOUD_RUN_SERVICE)..."
            az containerapp update \
              --name "$CLOUD_RUN_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE"
          else
            echo "Creating new Container App ($CLOUD_RUN_SERVICE)..."
            az containerapp create \
              --name "$CLOUD_RUN_SERVICE" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_APP_ENVIRONMENT" \
              --image "$IMAGE" \
              --cpu 1 \
              --memory 2Gi \
              --ingress external \
              --target-port 80 \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$AZCR_USERNAME" \
              --registry-password "$AZCR_PASSWORD"
          fi

          echo ""
          echo "Deployed: $CLOUD_RUN_SERVICE"

          URL=$(az containerapp show \
            --name "$CLOUD_RUN_SERVICE" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "URL: https://${URL}"